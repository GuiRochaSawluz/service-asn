server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    absolute_redirect off;
    port_in_redirect off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ALB: JSON estático, sem proxy e sem I/O.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"asn-service"}';
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    # /{slug}/api/... permanece no satélite. Sem isso o ALB entrega /api ao Hub.
    location ~ ^/(?<sc_slug>[^/.]+)/api(?<sdk_path>/.*)?$ {
        proxy_pass http://127.0.0.1:8003/api$sdk_path$is_args$args;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /$sc_slug;
    }

    location ~ ^/api(?<sdk_path>/.*)?$ {
        proxy_pass http://127.0.0.1:8003/api$sdk_path$is_args$args;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?<sc_slug>[^/.]+)/docs/?$ {
        proxy_pass http://127.0.0.1:8003/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /$sc_slug;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8003/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(?<sc_slug>[^/.]+)/openapi\.json$ {
        proxy_pass http://127.0.0.1:8003/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /$sc_slug;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8003/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/[^/.]+/health$ {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"asn-service"}';
    }

    # Handshake do Umbrella exige barra final.
    location ~ ^/(?<slug>[^/.]+)$ {
        return 301 /$slug/;
    }

    location ~ ^/(?<slug>[^/.]+)/index\.html$ {
        return 301 /$slug/;
    }

    # JS/CSS sob o slug: devolve o arquivo real. Nunca index.html (MIME text/html).
    location ~ ^/(?!assets/)[^/.]+(?<asset_path>/.*\.(?:js|mjs|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|otf|wasm|webmanifest|txt|xml|pdf|csv))$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $asset_path =404;
    }

    location ~ ^(?<asset_path>/.*\.(?:js|mjs|css|map|json|png|jpg|jpeg|gif|svg|ico|webp|avif|woff|woff2|ttf|eot|otf|wasm|webmanifest|txt|xml|pdf|csv))$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $asset_path =404;
    }

    # /{slug}/ é diretório no disco. try_files nessa URI devolve 403 e o Hub
    # mostra "não foi possível acessar este serviço" sem chamar a API.
    location ~ ^/[^/.]+/$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files /index.html =404;
    }

    location ~ ^/[^/.]+(?<slug_path>/.*)$ {
        root /usr/share/nginx/html;
        try_files $slug_path @index;
    }

    location @index {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        root /usr/share/nginx/html;
        rewrite ^ /index.html break;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ @index;
    }
}
