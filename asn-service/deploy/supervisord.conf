[supervisord]
nodaemon=true
user=root
loglevel=info
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:asn-backend]
directory=/app/asn-backend
command=/opt/venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8003
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
priority=30
